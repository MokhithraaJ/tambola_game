<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HappyFox Diwali Celebration</title>
<link id="favicon" rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root {
  --bg-top: #0B14A8; --bg-bot: #060A55;
  --on-bg: #FFFFFF; --on-bg-muted: #C3D0FF;
  --gold: #FFC845; --gold-2: #FF9A1F;
  --ticket: #F4F7FF; --ticket-line: #BFCDFF; --cell: #FFFFFF; --num: #1B2A9E;
  --ink: #0B1257; --muted: #4B5A9E;
  --mark: #FF9A1F; --mark-2: #FFC845; --mark-ink: #0B1257;
  --quiz-bg: #DCE6FF; --quiz-line: #6F8CFF; --quiz-ink: #1B2A9E;
  --ok: #1F7A45; --ok-text: #1F7A45; --bad: #C0281C; --bad-text: #C0281C; --bad-soft: #FDE2DE; --on-state: #FFFFFF;
  --shadow: rgba(0, 0, 50, .35);
  --font-display: 'Bricolage Grotesque', 'Poppins', system-ui, sans-serif;
  --font-body: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-script: 'Great Vibes', 'Brush Script MT', cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--on-bg); font: 400 15px/1.5 var(--font-body);
  background-color: #070B5A;
  background-image:
    radial-gradient(900px 560px at 10% 0%, rgba(40, 76, 235, .75), transparent 65%),
    radial-gradient(760px 520px at 100% 100%, rgba(30, 62, 215, .6), transparent 65%),
    linear-gradient(180deg, var(--bg-top), var(--bg-bot));
  background-attachment: fixed;
}
button, input { font-family: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Decorations: hanging diyas and mandalas */
.decor { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.decor .d { position: absolute; top: 0; width: clamp(80px, 15vw, 160px); opacity: .9; }
.decor .d.l { left: 0; }
.decor .d.r { right: 0; transform: scaleX(-1); }
.decor svg { display: block; width: 100%; height: auto; }
.decor .m { position: absolute; width: clamp(190px, 30vw, 300px); color: rgba(140, 168, 255, .32); }
.decor .m.tl { top: -70px; left: -70px; }
.decor .m.br { bottom: -80px; right: -80px; }
@media (max-width: 560px) { .decor .d { opacity: .55; } }

.inner {
  position: relative; z-index: 1; max-width: 880px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { position: relative; z-index: 1; padding-top: env(safe-area-inset-top, 0px); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { flex: none; width: 46px; height: 46px; border-radius: 12px; display: block; box-shadow: 0 0 0 2px rgba(255, 255, 255, .85), 0 8px 18px rgba(0, 0, 40, .45); }
.brand-name { font: 800 clamp(16px, 4.4vw, 21px)/1.1 var(--font-display); margin: 0; }
.brand-tag { margin: 2px 0 0; font-size: 12px; color: var(--on-bg-muted); }
@media (max-width: 480px) { .brand-tag { display: none; } }
.greet { min-width: 0; text-align: right; line-height: 1.1; }
.greet-hd { margin: 0; font: 400 clamp(26px, 6vw, 34px)/1 var(--font-script); color: var(--gold); }
.greet-name { margin: 2px 0 0; font-size: 13px; font-weight: 600; max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: auto; }

main { padding-block: 22px 56px; }
.btn {
  font: 700 15px/1 var(--font-body); border: 0; border-radius: 10px; padding: 0 20px; min-height: 48px; cursor: pointer;
  color: var(--ink); background: linear-gradient(135deg, var(--gold), var(--gold-2)); box-shadow: 0 8px 18px -8px rgba(0, 0, 40, .6);
}
.btn:hover { filter: brightness(1.06); }
h1 { font: 800 clamp(30px, 7vw, 44px)/1.05 var(--font-display); letter-spacing: -.01em; margin: 0 0 10px; text-wrap: balance; }
.lede { margin: 0 0 22px; color: var(--on-bg-muted); }
.eyebrow { margin: 0; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Sign-in */
.login { max-width: 460px; margin: clamp(24px, 9vh, 90px) auto 0; text-align: center; }
.login label { display: block; font-weight: 600; margin-bottom: 8px; text-align: left; }
.field-row { display: flex; flex-wrap: wrap; gap: 10px; }
input[type="text"] {
  flex: 1 1 200px; min-width: 0; width: 100%; min-height: 48px; padding: 0 14px; font: 500 16px/1.2 var(--font-body);
  color: var(--ink); background: #fff; border: 1.5px solid var(--ticket-line); border-radius: 10px;
}
input[type="text"]::placeholder { color: var(--muted); opacity: .7; }
input[type="text"].bad { border-color: var(--bad); background: var(--bad-soft); }
.msg { min-height: 1.6em; margin: 8px 0 0; font-weight: 600; font-size: 14px; text-align: left; }
.msg.bad { color: var(--bad-text); }
.msg.ok { color: var(--ok-text); }
.login .msg.bad { color: #FFB8AC; }

/* Ticket */
.ticket {
  color: var(--ink); background: var(--ticket); border: 1.5px solid var(--ticket-line); border-top: 5px solid var(--gold); border-radius: 16px;
  padding: 14px clamp(8px, 2.4vw, 18px) clamp(10px, 2.4vw, 18px); box-shadow: 0 18px 36px -16px rgba(0, 0, 30, .7);
}
.ticket-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 0 4px 12px; margin-bottom: 12px; border-bottom: 2px dashed var(--ticket-line); }
.serial { margin: 0; font: 800 clamp(22px, 5vw, 30px)/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.player { min-width: 0; text-align: right; }
.player-name { margin: 0; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: clamp(3px, 1vw, 8px); }
.cell {
  appearance: none; margin: 0; padding: 0; aspect-ratio: 5 / 6; display: grid; place-items: center;
  border: 1.5px solid transparent; border-radius: clamp(6px, 1.2vw, 10px);
  font: 600 clamp(13px, 3.7vw, 24px)/1 var(--font-body); font-variant-numeric: tabular-nums;
  color: var(--num); background: var(--cell); box-shadow: 0 1px 3px var(--shadow);
  cursor: pointer; transition: background .15s, color .15s, transform .1s; -webkit-tap-highlight-color: transparent;
}
@media (min-width: 600px) { .cell { aspect-ratio: 1 / 1; } }
.cell:active { transform: scale(.94); }
.cell.marked { background: linear-gradient(145deg, var(--mark-2), var(--mark)); color: var(--mark-ink); font-weight: 700; box-shadow: 0 3px 8px -2px rgba(150, 80, 0, .5); }
.cell.quiz { background: var(--quiz-bg); color: var(--quiz-ink); box-shadow: none; border: 1.5px dashed var(--quiz-line); font-size: clamp(11px, 3.1vw, 18px); }
.cell.quiz.solved { background: var(--ok); color: var(--on-state); border-color: transparent; }
.cell.quiz.wrong { background: var(--bad); color: var(--on-state); border-color: transparent; }
.cell.quiz.none { cursor: default; background: transparent; border-color: var(--ticket-line); }
.cell svg { width: 55%; height: auto; }
.shake { animation: shake .45s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

.note { margin: 16px 0 0; font-size: 13px; color: var(--on-bg-muted); max-width: 60ch; }

/* Question sheet */
.sheet-back {
  position: fixed; inset: 0; z-index: 50; background: rgba(3, 6, 50, .72); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding: clamp(16px, 12vh, 96px) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet { color: var(--ink); width: 100%; max-width: 480px; background: var(--ticket); border: 1.5px solid var(--ticket-line); border-top: 5px solid var(--gold); border-radius: 16px; padding: 18px; box-shadow: 0 24px 50px -20px rgba(0, 0, 0, .7); }
.sheet-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.icon-btn { appearance: none; border: 0; background: transparent; color: var(--muted); width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; margin: -6px -8px 0 0; }
.icon-btn:hover { color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.question { margin: 6px 0 16px; font: 700 clamp(20px, 5vw, 26px)/1.25 var(--font-display); text-wrap: balance; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="inner bar">
    <div class="brand">
      <img class="logo" id="logo" alt="HappyFox logo" width="46" height="46">
      <div>
        <p class="brand-name" id="brand-name">HappyFox Diwali Celebration</p>
        <p class="brand-tag" id="brand-tag"></p>
      </div>
    </div>
    <div class="greet" id="greet" hidden>
      <p class="greet-hd">Happy Diwali</p>
      <p class="greet-name" id="greet-name"></p>
    </div>
  </div>
</header>

<main class="inner">
  <section id="view-login" class="login">
    <h1>Get your ticket</h1>
    <p class="lede">Type your name or employee ID. The same entry always gives you the same ticket, on any phone or laptop.</p>
    <form id="login-form" novalidate>
      <label for="player-id">Name or employee ID</label>
      <div class="field-row">
        <input id="player-id" type="text" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" >
        <button type="submit" class="btn">Get my ticket</button>
      </div>
      <p class="msg bad" id="login-msg" role="alert"></p>
    </form>
  </section>

  <section id="view-game" hidden>
    <div id="ticket-host"></div>
    <p class="note">Tap a number when the host calls it. Tap a Q block to answer its question. Your marks and answers are saved on this device.</p>
  </section>
</main>

<div class="sheet-back" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="q-label">
    <div class="sheet-top">
      <p class="eyebrow" id="q-label">Question</p>
      <button type="button" class="icon-btn" id="q-close" aria-label="Close question">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="question" id="q-text"></p>
    <form id="q-form" novalidate>
      <label for="q-answer" class="sr-only">Your answer</label>
      <div class="field-row">
        <input id="q-answer" type="text" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer">
        <button type="submit" class="btn">Check answer</button>
      </div>
    </form>
    <p class="msg" id="q-msg" aria-live="polite"></p>
  </div>
</div>

<script>
/* ============ QUIZ QUESTIONS ============ */
const GAME_TITLE = "HappyFox Diwali Celebration";
const TAGLINE = "Mark it. Answer it. Shout HOUSIE!";
const TICKET_SALT = "office-housie-v1";             // changing this gives everyone a different ticket

// Keep exactly 12 questions: a ticket always has 12 quiz blocks.
// "a" lists every accepted answer. Case, punctuation and a leading a/an/the are ignored.
const QUESTIONS = [
  { q: "How many months of the year have 28 days?",                      a: ["12", "twelve", "all", "all of them", "all 12", "all twelve"] },

  { q: "Which fruit wears its seeds on the outside?",                    a: ["strawberry", "strawberries"] },
  { q: "I have keys but no locks, and space but no room. What am I?",    a: ["keyboard", "keyboards"] },
  { q: "What has a face and two hands but no arms or legs?",             a: ["clock", "clocks", "watch"] },
  { q: "Which animal is called the Ship of the Desert?",                 a: ["camel", "camels"] },
  { q: "What kind of room has no doors and no windows?",                 a: ["mushroom", "mushrooms", "mushroom room"] },
  { q: "A doctor gives you 3 pills and says take one every half hour. How many minutes until they are all gone?", a: ["60", "sixty", "60 minutes", "sixty minutes", "1 hour", "one hour", "an hour", "1 hr"] },

  { q: "What word becomes shorter when you add two letters to it?",      a: ["short"] },
  { q: "Which Indian city is called the Pink City?",                     a: ["jaipur"] },
  { q: "What goes up every year but never comes down?",                  a: ["age", "your age", "my age"] }
];

// <logic>
function normalizeId(id) { return String(id).trim().replace(/\s+/g, ' ').toLowerCase(); }

function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Same name or ID in = same ticket out. 3 rows x 9 columns, 5 numbers per row, 1 to 3 per column.
function makeTicket(id) {
  const key = normalizeId(id);
  const seed = xmur3(TICKET_SALT + '|' + key)();
  const rnd = mulberry32(seed);
  const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  let counts = null, rowsOf = null;
  for (let tries = 0; tries < 10000 && !rowsOf; tries++) {
    counts = Array(9).fill(1);
    for (let extra = 6; extra > 0;) { const c = Math.floor(rnd() * 9); if (counts[c] < 3) { counts[c]++; extra--; } }
    const candidate = counts.map((n) => shuffle([0, 1, 2]).slice(0, n).sort((a, b) => a - b));
    const perRow = [0, 0, 0];
    candidate.forEach((rs) => rs.forEach((r) => perRow[r]++));
    if (perRow.every((n) => n === 5)) rowsOf = candidate;
  }
  if (!rowsOf) throw new Error('Could not build a ticket');

  const grid = [[], [], []];
  for (let c = 0; c < 9; c++) {
    const lo = c === 0 ? 1 : c * 10, hi = c === 8 ? 90 : c * 10 + 9;
    const pool = []; for (let n = lo; n <= hi; n++) pool.push(n);
    const picked = shuffle(pool).slice(0, counts[c]).sort((a, b) => a - b);
    for (let r = 0; r < 3; r++) grid[r][c] = null;
    rowsOf[c].forEach((r, i) => { grid[r][c] = picked[i]; });
  }
  let q = 0;
  const quiz = grid.map((row) => row.map((n) => (n === null ? q++ : -1)));
  const numbers = grid.flat().filter((n) => n !== null);
  const serial = String(xmur3('serial|' + key)() % 10000).padStart(4, '0');
  return { key, serial, grid, quiz, numbers };
}

function norm(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(a|an|the|my|your)\s+/, '');
}
function isCorrect(qi, text) {
  const t = norm(text);
  return t !== '' && QUESTIONS[qi].a.some((x) => norm(x) === t);
}
// </logic>

/* ============ PAGE CODE ============ */
const $ = (s) => document.querySelector(s);
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---- saving: marks and solved questions are kept per name on this device ---- */
const STORE_PREFIX = 'housie:v2:';   // change to housie:v3: to reset everyone's saved progress
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked: the game still works */ } }
};
function loadState(ticket) {
  const empty = { marks: new Set(), solved: new Set() };
  try {
    const raw = store.get(STORE_PREFIX + ticket.key);
    if (!raw) return empty;
    const o = JSON.parse(raw);
    return {
      marks: new Set((o.marks || []).filter((n) => ticket.numbers.includes(n))),
      solved: new Set((o.solved || []).filter((i) => i >= 0 && i < QUESTIONS.length))
    };
  } catch (e) { return empty; }
}
function saveState() {
  if (!player) return;
  store.set(STORE_PREFIX + player.ticket.key, JSON.stringify({ marks: [...player.state.marks], solved: [...player.state.solved] }));
}

let player = null;
const sheet = { qi: null, timer: null, opener: null };

/* ---- ticket drawing ---- */
function ticketEl(ticket, name) {
  const root = document.createElement('div');
  root.className = 'ticket';
  root.innerHTML = '<div class="ticket-head"><div><p class="eyebrow">Ticket</p><p class="serial">No. ' + ticket.serial +
    '</p></div><div class="player"><p class="eyebrow">Player</p><p class="player-name"></p></div></div><div class="grid"></div>';
  root.querySelector('.player-name').textContent = name;
  return root;
}
function buildCells(host, ticket) {
  host.textContent = '';
  const cells = [];
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 9; c++) {
      const num = ticket.grid[r][c];
      const qi = ticket.quiz[r][c];
      const hasQ = num === null && qi < QUESTIONS.length;
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'cell' + (num === null ? ' quiz' : '') + (num === null && !hasQ ? ' none' : '');
      el.dataset.i = String(cells.length);
      if (num !== null) el.textContent = String(num);
      cells.push({ el, num, qi, hasQ });
      host.appendChild(el);
    }
  }
  return cells;
}
function paintCells(cells, state, wrong) {
  cells.forEach((cell) => {
    const el = cell.el;
    if (cell.num !== null) {
      const on = state.marks.has(cell.num);
      el.classList.toggle('marked', on);
      el.setAttribute('aria-pressed', String(on));
      el.setAttribute('aria-label', 'Number ' + cell.num + (on ? ', marked' : ''));
      return;
    }
    if (!cell.hasQ) { el.disabled = true; return; }
    const st = state.solved.has(cell.qi) ? 'solved' : (wrong.has(cell.qi) ? 'wrong' : 'open');
    if (el.dataset.st !== st) {
      el.dataset.st = st;
      el.classList.toggle('solved', st === 'solved');
      el.classList.toggle('wrong', st === 'wrong');
      if (st === 'solved') el.innerHTML = CHECK; else el.textContent = 'Q' + (cell.qi + 1);
    }
    const label = st === 'solved' ? 'solved' : (st === 'wrong' ? 'answered wrong, try again' : 'not answered yet');
    el.setAttribute('aria-label', 'Question ' + (cell.qi + 1) + ', ' + label);
  });
}
function refresh() { paintCells(player.cells, player.state, player.wrong); }

/* ---- views ---- */
function startGame(display) {
  const ticket = makeTicket(display);
  const state = loadState(ticket);   // restores earlier marks and answers for this name
  const root = ticketEl(ticket, display);
  const cells = buildCells(root.querySelector('.grid'), ticket);
  player = { display, ticket, state, cells, wrong: new Set() };
  $('#ticket-host').replaceChildren(root);
  paintCells(cells, state, player.wrong);
  $('#view-login').hidden = true;
  $('#view-game').hidden = false;
  $('#greet').hidden = false;
  $('#greet-name').textContent = display;
  window.scrollTo(0, 0);
}
function showLogin() {
  closeSheet();
  player = null;
  $('#ticket-host').textContent = '';
  $('#view-game').hidden = true;
  $('#greet').hidden = true;
  $('#view-login').hidden = false;
  $('#login-msg').textContent = '';
  $('#player-id').value = '';
  window.scrollTo(0, 0);
}

/* ---- question sheet ---- */
function setMsg(text, kind) {
  const el = $('#q-msg');
  el.textContent = text || '';
  el.className = 'msg' + (kind ? ' ' + kind : '');
}
function openSheet(qi, opener) {
  sheet.qi = qi; sheet.opener = opener;
  const solved = player.state.solved.has(qi);
  const input = $('#q-answer');
  $('#q-label').textContent = 'Question ' + (qi + 1) + ' of ' + QUESTIONS.length;
  $('#q-text').textContent = QUESTIONS[qi].q;
  input.value = ''; input.classList.remove('bad');
  $('#q-form').hidden = solved;
  if (solved) setMsg('Solved. The answer is ' + QUESTIONS[qi].a[0] + '.', 'ok'); else setMsg('');
  $('#sheet').hidden = false;
  (solved ? $('#q-close') : input).focus();
}
function closeSheet() {
  clearTimeout(sheet.timer);
  if ($('#sheet').hidden) return;
  $('#sheet').hidden = true;
  const o = sheet.opener; sheet.opener = null; sheet.qi = null;
  if (o && document.contains(o)) o.focus();
}
function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

$('#q-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const qi = sheet.qi; if (qi === null || !player) return;
  const input = $('#q-answer');
  if (!input.value.trim()) { setMsg('Type your answer first.', 'bad'); input.focus(); return; }
  if (isCorrect(qi, input.value)) {
    player.state.solved.add(qi); player.wrong.delete(qi);
    saveState(); refresh();
    $('#q-form').hidden = true;
    setMsg('Correct!', 'ok');
    sheet.timer = setTimeout(closeSheet, 900);
  } else {
    player.wrong.add(qi);
    refresh();
    const cell = player.cells.find((c) => c.qi === qi && c.num === null);
    if (cell) shake(cell.el);
    input.value = '';
    input.classList.add('bad');
    shake(input);
    setMsg('Not quite. Try again.', 'bad');
    input.focus();
  }
});
$('#q-answer').addEventListener('input', () => $('#q-answer').classList.remove('bad'));
$('#q-close').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

/* ---- ticket taps ---- */
$('#ticket-host').addEventListener('click', (e) => {
  const b = e.target.closest('.cell');
  if (!b || !player) return;
  const cell = player.cells[Number(b.dataset.i)];
  if (!cell) return;
  if (cell.num !== null) {
    const m = player.state.marks;
    if (m.has(cell.num)) m.delete(cell.num); else m.add(cell.num);
    saveState(); refresh();
  } else if (cell.hasQ) {
    openSheet(cell.qi, b);
  }
});

/* ---- sign in ---- */
$('#login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('#player-id').value.trim().replace(/\s+/g, ' ');
  if (!v) { $('#login-msg').textContent = 'Enter your name or employee ID to get your ticket.'; $('#player-id').focus(); return; }
  startGame(v);
  history.pushState({ view: 'game', id: v }, '');   // new history entry, so Back returns to the login page
});

/* ---- browser back / forward arrows ---- */
window.addEventListener('popstate', (e) => {
  if (e.state && e.state.view === 'game') startGame(e.state.id);   // Forward arrow: ticket with saved marks
  else showLogin();                                                 // Back arrow: Get ticket page
});

/* ---- decorations ---- */
(function decorate() {
  const diya = (x, y) => '<g transform="translate(' + x + ' ' + y + ')" fill="#fff"><path d="M20 0C26 8 27 13 20 19 13 13 14 8 20 0Z"/><path d="M0 24H40C40 36 31 44 20 44 9 44 0 36 0 24Z"/></g>';
  const ring = (x, y) => '<circle cx="' + x + '" cy="' + y + '" r="8" fill="#1B2DC4" stroke="#fff" stroke-width="2"/><circle cx="' + x + '" cy="' + y + '" r="2.5" fill="#fff"/>';
  const str = (x, len) => '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + len + '" stroke="#9DB2FF" stroke-width="1.6" stroke-dasharray="1 4" stroke-linecap="round"/>';
  const strings = '<svg viewBox="0 0 150 400">' + str(35, 205) + ring(35, 35) + ring(35, 105) + ring(35, 165) + diya(15, 205) +
    str(105, 300) + ring(105, 70) + ring(105, 135) + ring(105, 200) + diya(85, 295) + '</svg>';
  let petals = '';
  for (let i = 0; i < 16; i++) petals += '<ellipse cx="0" cy="-62" rx="11" ry="26" transform="rotate(' + (i * 22.5) + ')"/>';
  const mandala = '<svg viewBox="-100 -100 200 200" fill="none" stroke="currentColor" stroke-width="1.5"><circle r="20"/><circle r="34" stroke-dasharray="2 4"/>' + petals + '<circle r="94" stroke-dasharray="1 5"/></svg>';
